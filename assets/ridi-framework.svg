<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">The five-part RIDI audit</title>
  <desc id="desc">Stable aggregate performance does not certify stable decision identity. The RIDI workflow measures, attributes, certifies, controls and validates finite decision turnover.</desc>
  <defs>
    <style>
      .title{font:700 31px Arial,sans-serif;fill:#17212b}.sub{font:18px Arial,sans-serif;fill:#536270}.n{font:700 18px Arial,sans-serif;fill:#fff}.h{font:700 19px Arial,sans-serif;fill:#17212b}.p{font:14px Arial,sans-serif;fill:#465563}.arrow{stroke:#71808d;stroke-width:3;fill:none}.box{stroke-width:2.2}.foot{font:700 17px Arial,sans-serif;fill:#17212b}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#71808d"/></marker>
  </defs>
  <rect width="1200" height="310" rx="22" fill="#f7fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">Performance agreement ≠ decision-identity reproducibility</text>
  <text x="600" y="72" text-anchor="middle" class="sub">The Reproducibility of Identity Decisions Index turns finite top-k turnover into an auditable scientific object.</text>
  <g transform="translate(35 104)">
    <rect class="box" width="190" height="116" rx="16" fill="#e8f3fb" stroke="#2f78b7"/><circle cx="28" cy="28" r="17" fill="#2f78b7"/><text x="28" y="34" text-anchor="middle" class="n">1</text><text x="55" y="34" class="h">Measure</text><text x="18" y="69" class="p">Which identities crossed</text><text x="18" y="90" class="p">the decision boundary?</text>
    <path class="arrow" d="M195 58H220" marker-end="url(#arrow)"/>
    <g transform="translate(230)"><rect class="box" width="190" height="116" rx="16" fill="#fff1e7" stroke="#d76a11"/><circle cx="28" cy="28" r="17" fill="#d76a11"/><text x="28" y="34" text-anchor="middle" class="n">2</text><text x="55" y="34" class="h">Attribute</text><text x="18" y="69" class="p">Separate representation</text><text x="18" y="90" class="p">from labels and noise.</text></g>
    <path class="arrow" d="M425 58H450" marker-end="url(#arrow)"/>
    <g transform="translate(460)"><rect class="box" width="190" height="116" rx="16" fill="#eaf8f4" stroke="#008d72"/><circle cx="28" cy="28" r="17" fill="#008d72"/><text x="28" y="34" text-anchor="middle" class="n">3</text><text x="55" y="34" class="h">Certify</text><text x="18" y="69" class="p">Guarantee zero turnover</text><text x="18" y="90" class="p">when γₖ &gt; 2ε.</text></g>
    <path class="arrow" d="M655 58H680" marker-end="url(#arrow)"/>
    <g transform="translate(690)"><rect class="box" width="190" height="116" rx="16" fill="#f3edfa" stroke="#71469a"/><circle cx="28" cy="28" r="17" fill="#71469a"/><text x="28" y="34" text-anchor="middle" class="n">4</text><text x="55" y="34" class="h">Control</text><text x="18" y="69" class="p">Minimize turnover within</text><text x="18" y="90" class="p">a declared utility budget.</text></g>
    <path class="arrow" d="M885 58H910" marker-end="url(#arrow)"/>
    <g transform="translate(920)"><rect class="box" width="190" height="116" rx="16" fill="#edf1ff" stroke="#4d63b7"/><circle cx="28" cy="28" r="17" fill="#4d63b7"/><text x="28" y="34" text-anchor="middle" class="n">5</text><text x="55" y="34" class="h">Validate</text><text x="18" y="69" class="p">Test changed identities</text><text x="18" y="90" class="p">against independent outcomes.</text></g>
  </g>
  <text x="600" y="273" text-anchor="middle" class="foot">Measure change; do not assume that either change or stability is automatically correct.</text>
</svg>
