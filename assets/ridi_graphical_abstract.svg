<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">RIDI graphical abstract: identical audits can yield different AI decisions</title>
  <desc id="desc">SciFact 275 holds the complete retrieval audit fixed while changing metric-zero passage identities. The verdict changes from SUPPORTS to REFUTES. EPSS independently shows large production allocation turnover.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef7f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16324a" flood-opacity="0.10"/>
    </filter>
    <style>
      .t{font-family:Inter,Arial,sans-serif;fill:#132238}
      .muted{fill:#58677a}
      .small{font-size:21px}
      .body{font-size:25px}
      .label{font-size:22px;font-weight:700}
      .big{font-size:38px;font-weight:800}
      .hero{font-size:48px;font-weight:850}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:20px;fill:#21364d}
    </style>
  </defs>
  <rect width="1400" height="820" rx="26" fill="url(#bg)"/>

  <text class="t hero" x="70" y="78">Identical audits can yield different AI decisions</text>
  <text class="t body muted" x="72" y="120">Allocation identity is a missing object at the score-to-action boundary of capacity-limited AI.</text>

  <rect x="60" y="158" width="1280" height="430" rx="24" fill="#ffffff" filter="url(#shadow)"/>

  <text class="t label" x="105" y="205">SciFact 275 · preregistered RAG case</text>

  <rect x="95" y="235" width="360" height="255" rx="20" fill="#eef6ff" stroke="#9ec5ea"/>
  <text class="t label" x="125" y="277">Context A · reference</text>
  <text class="t small muted" x="125" y="317">Positive passage fixed at rank 1</text>
  <text class="t small muted" x="125" y="350">9 metric-zero passage identities</text>
  <rect x="125" y="383" width="300" height="65" rx="14" fill="#daf3df"/>
  <text class="t big" x="170" y="428" fill="#11743b">SUPPORTS</text>

  <rect x="520" y="235" width="360" height="255" rx="20" fill="#f8fafc" stroke="#c7d1dc"/>
  <text class="t label" x="550" y="277">Exact audit preserved</text>
  <text class="mono" x="550" y="318">precision@10  0.1000</text>
  <text class="mono" x="550" y="350">recall@10     0.3333</text>
  <text class="mono" x="550" y="382">nDCG@10       0.4693</text>
  <text class="mono" x="550" y="414">MRR@10        1.0000</text>
  <text class="mono" x="550" y="446">MAP@10        0.3333</text>

  <rect x="945" y="235" width="360" height="255" rx="20" fill="#fff3f1" stroke="#efb4ad"/>
  <text class="t label" x="975" y="277">Context B · identity substitution</text>
  <text class="t small muted" x="975" y="317">Same positive passage, same rank</text>
  <text class="t small muted" x="975" y="350">9 metric-zero identities replaced</text>
  <text class="t small" x="975" y="382">RIDI = 0.947</text>
  <rect x="975" y="398" width="300" height="65" rx="14" fill="#fde0dc"/>
  <text class="t big" x="1038" y="443" fill="#b42318">REFUTES</text>

  <path d="M455 360 H505" stroke="#718096" stroke-width="6" stroke-linecap="round"/>
  <path d="M490 344 L510 360 L490 376" fill="none" stroke="#718096" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M880 360 H930" stroke="#718096" stroke-width="6" stroke-linecap="round"/>
  <path d="M915 344 L935 360 L915 376" fill="none" stroke="#718096" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="95" y="515" width="1210" height="48" rx="14" fill="#173b57"/>
  <text x="700" y="548" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#ffffff">Audit equivalence ≠ allocation equivalence ≠ decision equivalence</text>

  <rect x="60" y="620" width="620" height="145" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text class="t label" x="95" y="665">Production stress test · EPSS v2→v3</text>
  <text class="t big" x="95" y="718">565 / 1,000</text>
  <text class="t small muted" x="300" y="718">priorities changed</text>
  <text class="t small muted" x="95" y="750">Adjacent same-version controls: 0 and 7 · independently reproduced by 2 external executors</text>

  <rect x="720" y="620" width="620" height="145" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text class="t label" x="755" y="665">Constructive endpoint · identity–utility frontier</text>
  <text class="t body" x="755" y="707">Minimize membership change subject to an explicit</text>
  <text class="t body" x="755" y="741">updated-score utility-regret budget — no retraining required.</text>

  <text class="t small muted" x="70" y="800">RIDI · allocation-identity auditing for capacity-limited AI · current manuscript science lock, 4 Sep 2026</text>
</svg>
