name: Import RIDI v95.4 preregistration freeze

on:
  push:
    branches: [prereg-v95-4-20260923]
    paths:
      - .github/workflows/import_prereg_v95_4.yml

permissions:
  contents: write

jobs:
  import-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prereg-v95-4-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser client
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Download frozen bundle through share page
        env:
          SHARE_URL: https://firestorage.ai/en/f/e6yWh5nhkGkr
          EXPECTED_SHA256: 075e925ddca308a456b61e74fc3c3b5c85e3e1f597bacbc33ebcfb0b2f020e5e
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out = Path("/tmp/RIDI_v95.4_GitHub_Code_Freeze_20260923.zip")
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(accept_downloads=True)
              page.goto(os.environ["SHARE_URL"], wait_until="networkidle", timeout=120000)
              with page.expect_download(timeout=120000) as info:
                  page.get_by_role("button", name="Download").click()
              info.value.save_as(str(out))
              browser.close()
          got = hashlib.sha256(out.read_bytes()).hexdigest()
          exp = os.environ["EXPECTED_SHA256"]
          print("downloaded sha256", got)
          if got != exp:
              raise SystemExit(f"SHA-256 mismatch: {got} != {exp}")
          PY
      - name: Import reviewed freeze
        run: |
          rm -rf /tmp/ridi-import preregistration/v95.4
          mkdir -p /tmp/ridi-import preregistration/v95.4
          unzip -q /tmp/RIDI_v95.4_GitHub_Code_Freeze_20260923.zip -d /tmp/ridi-import
          cp -a /tmp/ridi-import/ridi_v954_gitfreeze/. preregistration/v95.4/
          sha256sum preregistration/v95.4/08_New_Experiments/p2_noise_floor.py
          sha256sum preregistration/v95.4/08_New_Experiments/frozen_registered/scoring.py
      - name: Commit immutable preregistration code state
        run: |
          git config user.name "RIDI preregistration bot"
          git config user.email "adeebnoor@users.noreply.github.com"
          git add preregistration/v95.4
          git commit -m "Freeze RIDI Nature v95.4 preregistration code"
          git push origin prereg-v95-4-20260923
