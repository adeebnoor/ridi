name: Publish ridi-audit to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version to publish (for example 1.1.0)"
        required: true
        default: "1.1.0"
  push:
    branches: [main]
    paths:
      - ".pypi-release-1.1.0"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify, and smoke-test distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify release version
        shell: bash
        run: |
          PACKAGE_VERSION=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as fh:
              print(tomllib.load(fh)['project']['version'])
          PY
          )
          echo "Package version: ${PACKAGE_VERSION}"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            EXPECTED_TAG="v${PACKAGE_VERSION}"
            if [[ "${{ github.event.release.tag_name }}" != "${EXPECTED_TAG}" ]]; then
              echo "Release tag must be ${EXPECTED_TAG}; got ${{ github.event.release.tag_name }}"
              exit 1
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.version }}" != "${PACKAGE_VERSION}" ]]; then
              echo "workflow_dispatch version must equal ${PACKAGE_VERSION}; got ${{ inputs.version }}"
              exit 1
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${PACKAGE_VERSION}" != "1.1.0" ]]; then
              echo "One-time push trigger is locked to 1.1.0; got ${PACKAGE_VERSION}"
              exit 1
            fi
            test -f .pypi-release-1.1.0
          else
            echo "Unsupported release event: ${{ github.event_name }}"
            exit 1
          fi

      - name: Run test suite
        run: |
          python -m pip install -e ".[dev]"
          pytest -q

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify package metadata
        run: python -m twine check --strict dist/*

      - name: Clean-wheel smoke test
        shell: bash
        run: |
          python -m venv /tmp/ridi-wheel-check
          /tmp/ridi-wheel-check/bin/python -m pip install --upgrade pip
          /tmp/ridi-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/ridi-wheel-check/bin/ridi-audit --version
          /tmp/ridi-wheel-check/bin/ridi-audit demo
          /tmp/ridi-wheel-check/bin/python - <<'PY'
          from ridi_audit import audit, compare_allocations
          result = compare_allocations(['a', 'b', 'c'], ['a', 'b', 'd'])
          assert result.changed_slots == 1
          print('clean-wheel import and allocation comparison: OK')
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI via Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ridi-audit/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          print-hash: true
