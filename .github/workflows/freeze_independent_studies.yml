name: Freeze independent-study panels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "independent_studies/FREEZE_TRIGGER"

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install datasets==4.0.0 huggingface_hub==0.36.2
      - run: python independent_studies/ajse_execution_reproducibility/freeze_panel.py
      - run: python independent_studies/jksucis_evaluator_reliability/freeze_panel.py
      - name: Commit frozen panels
        run: |
          git config user.name "Prof. Adeeb Noor"
          git config user.email "adeebnoor@users.noreply.github.com"
          git add independent_studies/ajse_execution_reproducibility/frozen
          git add independent_studies/jksucis_evaluator_reliability/frozen
          git commit -m "Freeze clean-room study panels before model generation"
          git push origin HEAD:main
