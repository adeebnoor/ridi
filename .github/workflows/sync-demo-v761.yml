name: One-time RIDI demo v76.1 terminology sync

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update public RIDI demo and publication framing
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('demo/index.html')
          s=p.read_text(encoding='utf-8')
          reps={
            'Interactive RIDI SciFact 275 replay.':'Interactive RIDI selection-identity replay and RAG evidence example.',
            'RIDI · PREREGISTERED RAG · SCIFACT 275':'RIDI · SELECTION IDENTITY · PREREGISTERED RAG',
            'Identical audits can yield different AI decisions.':'Same retrieval evaluation. Different evidence. Different answer.',
            '<strong>17.27% of benchmark-defined RAG decisions flip</strong> at the preregistered primary condition, even when the registered retrieval audit is held exactly fixed.':'In the preregistered experiment, <strong>answer correctness changed in 17.27% of primary comparisons</strong> (equal-weight mean across four datasets) while the full assessed relevance-by-rank pattern and five retrieval metrics were held fixed.',
            'Run the decisive case':'Replay one registered example',
            'Same positive passage. Same rank. Same retrieval metrics.':'Same relevant passage. Same rank. Same relevance pattern. Same five metrics.',
            'AUDIT SIGNATURE: IDENTICAL':'RETRIEVAL EVALUATION: IDENTICAL',
            'Context B · identity substitution':'Context B · random zero-grade replacement',
            "<strong>Same audit. Different allocation. Different decision.</strong>":"<strong>Same retrieval evaluation. Different selected evidence. Different model output.</strong>",
            '</section><footer>RIDI · Adeeb Noor · King Abdulaziz University · Research software and evidence.</footer>':'<div class="status"><strong>RIDI is the audit toolkit.</strong> Selection identity is the object being measured; the identity–utility frontier computes the minimum turnover compatible with an explicit utility budget. <a href="../research.html">See the broader research program →</a></div></section><footer>RIDI · Selection identity auditing · Adeeb Noor · King Abdulaziz University.</footer>'
          }
          for a,b in reps.items():
              if a not in s: raise SystemExit('Missing demo text: '+a[:90])
              s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')

          p=Path('publications.html')
          s=p.read_text(encoding='utf-8')
          old='AI evaluation, allocation identity, ranking-to-action systems and the governance of consequential decisions.'
          new='Selection identity, the identity–utility frontier, ranking-update governance and consequential AI evaluation.'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Run tests
        run: pytest -q
      - name: Commit synced public pages
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/index.html publications.html
          git commit -m 'Align RIDI demo with v76.1 selection-identity framing'
          git push
