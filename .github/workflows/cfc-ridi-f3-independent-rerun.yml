name: CFC-RIDI F3 independent RIDI rerun

on:
  push:
    branches:
      - review/cfc-ridi-v0.2-f3-independent-rerun
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rerun-f3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RIDI branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch exact frozen CFC F3 suite
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/iller1/cfc-ai-evaluation.git /tmp/cfc
          cd /tmp/cfc
          git checkout --quiet 657fb9a0b2b8e1d384cfdee7119fc190c628d4c7
          test "$(git rev-parse HEAD)" = "657fb9a0b2b8e1d384cfdee7119fc190c628d4c7"
          test "$(git ls-remote origin refs/heads/freeze/cfc-ridi-v0.2-f3-suite-r1-failed | awk '{print $1}')" = "657fb9a0b2b8e1d384cfdee7119fc190c628d4c7"
          echo RIDI_F3_FREEZE_REF_PASS

      - name: Verify exact suite identities
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cfc
          test "$(wc -c < collaboration/cfc-ridi/v0.2/f3_suite/fixtures.py)" -eq 19906
          echo "7dd0fbd28f9c96ab9263dd437d6a766ac9134b334d18ec899d9e002310a9b0ed  collaboration/cfc-ridi/v0.2/f3_suite/fixtures.py" | sha256sum -c -
          test "$(git hash-object collaboration/cfc-ridi/v0.2/f3_suite/fixtures.py)" = "de90a4bf572cbf73e9c27abf037afa1a4fc709d0"

          test "$(wc -c < collaboration/cfc-ridi/v0.2/f3_suite/probe_f3.py)" -eq 4688
          echo "777355fafd140d498c96d7abe86d7697f9c639640c7a7e22793c709b62b2bed7  collaboration/cfc-ridi/v0.2/f3_suite/probe_f3.py" | sha256sum -c -
          test "$(git hash-object collaboration/cfc-ridi/v0.2/f3_suite/probe_f3.py)" = "1b1e4bd26b9a6444ec676b7d788bc0431f9fc4e4"

          test "$(wc -c < collaboration/cfc-ridi/v0.2/f3_suite/run_f3.py)" -eq 22512
          echo "fa478d57a93f9c0477f740f7f86929f5bdcc05b3efd2b764f9a392d293c5853d  collaboration/cfc-ridi/v0.2/f3_suite/run_f3.py" | sha256sum -c -
          test "$(git hash-object collaboration/cfc-ridi/v0.2/f3_suite/run_f3.py)" = "1a0c74aaffcc5edd1d9bc369a67a2c316941d2d5"

          test "$(wc -c < .github/workflows/cfc-ridi-f3-suite-r1.yml)" -eq 2730
          echo "6fd5b3ed185ed4079f3c39b84df470d6e4ca7f2fd96c217ac663d12622234971  .github/workflows/cfc-ridi-f3-suite-r1.yml" | sha256sum -c -
          test "$(git hash-object .github/workflows/cfc-ridi-f3-suite-r1.yml)" = "143d815d073914e1532eeea578d39cc9f7fe091d"

          echo RIDI_F3_SUITE_IDENTITY_PASS

      - name: Verify frozen F2 and Anchor identities
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cfc
          test "$(wc -c < collaboration/cfc-ridi/v0.2/f2_adapter/adapter.py)" -eq 28972
          echo "4b975fda6242c9a7e33d0d692705ef6fe82683dbf2bddefc0345c2e5504b480a  collaboration/cfc-ridi/v0.2/f2_adapter/adapter.py" | sha256sum -c -
          echo "4f70526185dbb69e4073c0baf89a6f924e8e1e220ba0317c339708bf5b152f34  collaboration/cfc-ridi/v0.2/f2_adapter/test_adapter.py" | sha256sum -c -
          echo "3bf666564b2c1a7f85526a3e223e7385e30a61c73e8d5f67ca0b17d954d7638a  collaboration/cfc-ridi/v0.2/f2_adapter/README.md" | sha256sum -c -
          echo "32b8c36ebb434fa620cdae970ed12bbb389a1ae62d20be6005e78b7c0db89591  collaboration/cfc-ridi/v0.2/f2_adapter/ADAPTER_MANIFEST.json" | sha256sum -c -
          echo "b3b1f11e060289afa4e7da61072f2c31be7f0da1786be90682ec307d4e1f5303  demonstrator/cfc_anchor-0.2.90rc1-py3-none-any.whl" | sha256sum -c -
          echo RIDI_F3_F2_BASELINE_IDENTITY_PASS

      - name: Install exact frozen Anchor wheel
        shell: bash
        run: |
          python -m pip install --quiet --no-deps /tmp/cfc/demonstrator/cfc_anchor-0.2.90rc1-py3-none-any.whl

      - name: Reproduce F2 baseline
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cfc
          python collaboration/cfc-ridi/v0.2/f2_adapter/test_adapter.py | tee /tmp/f2-baseline.txt
          grep -Fx "PASS 8/8" /tmp/f2-baseline.txt
          echo RIDI_F3_F2_BASELINE_PASS

      - name: Independently rerun exact F3 suite
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          cd /tmp/cfc
          python collaboration/cfc-ridi/v0.2/f3_suite/run_f3.py             --output collaboration/cfc-ridi/v0.2/f3_suite/F3_RESULTS_RIDI.json             | tee /tmp/f3-rerun.txt

      - name: Verify reproduced F3 outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cfc
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("collaboration/cfc-ridi/v0.2/f3_suite/F3_RESULTS_RIDI.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["tests_total"] == 15, data
          assert data["tests_passed"] == 14, data
          assert data["tests_failed"] == 1, data
          assert data["overall_status"] == "F3_NO_GO_REPRESENTATION_INVALID", data
          fails = [x for x in data["results"] if x["status"] != "PASS"]
          assert len(fails) == 1, fails
          t05 = fails[0]
          assert t05["test_id"] == "F3-T05", t05
          detail = json.dumps(t05.get("detail"), sort_keys=True, default=str)
          assert "mutation was silently ignored; diagnostic result identical to control" in detail, detail
          raw = p.read_bytes()
          print("RIDI_F3_REPRODUCED_14_15_PASS")
          print("RIDI_F3_REPRODUCED_T05_FAIL")
          print("RIDI_F3_RESULT_BYTES", len(raw))
          print("RIDI_F3_RESULT_SHA256", hashlib.sha256(raw).hexdigest())
          print("RIDI_F3_T05_DETAIL", detail)
          PY

      - name: Upload independent RIDI result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ridi-f3-r1-independent-result
          path: /tmp/cfc/collaboration/cfc-ridi/v0.2/f3_suite/F3_RESULTS_RIDI.json
          if-no-files-found: error
