name: CMS archive recovery
on:
  push:
    paths:
      - '.github/workflows/cms-archive-recovery.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Download official CMS IPPS Table 16B files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/raw out/inner out/logs
          python - <<'PY'
          import urllib.request, pathlib, hashlib, json, zipfile, datetime

          OUT=pathlib.Path("out")
          URLS={
            "FY2024":"https://www.cms.gov/files/zip/fy24-ipps-final-rule-16b.zip",
            "FY2025":"https://www.cms.gov/files/zip/fy-2025-ipps-final-rule-table-16-b.zip",
            "FY2026":"https://www.cms.gov/files/zip/fy2026-ipps-table-16b.zip",
          }
          def sha256(b): return hashlib.sha256(b).hexdigest()
          manifest={"source":"Centers for Medicare & Medicaid Services (CMS), IPPS Final Rule Table 16B","retrievals":[]}
          for fy,url in URLS.items():
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (RIDI reproducibility audit)"})
              retrieved=datetime.datetime.now(datetime.timezone.utc).isoformat()
              with urllib.request.urlopen(req,timeout=240) as r:
                  status=getattr(r,"status",200); data=r.read()
              raw=OUT/"raw"/f"{fy}_Table16B.zip"
              raw.write_bytes(data)
              raw_hash=sha256(data)
              z=zipfile.ZipFile(raw,"r")
              members=[i.filename for i in z.infolist() if not i.is_dir()]
              (OUT/"logs"/f"{fy}_listing.txt").write_text("\n".join(members),encoding="utf-8")
              books=[m for m in members if pathlib.PurePosixPath(m).suffix.lower() in {".xlsx",".xlsm",".xls"}]
              if len(books)!=1:
                  raise RuntimeError(f"{fy}: expected exactly one workbook, got {books}")
              member=books[0]
              b=z.read(member)
              suffix=pathlib.PurePosixPath(member).suffix.lower()
              inner=OUT/"inner"/f"{fy}_Table16B{suffix}"
              inner.write_bytes(b)
              ent={
                "fiscal_year":fy,
                "official_url":url,
                "retrieval_utc":retrieved,
                "http_status":status,
                "raw_zip_bytes":len(data),
                "raw_zip_sha256":raw_hash,
                "workbook_member":member,
                "workbook_bytes":len(b),
                "workbook_sha256":sha256(b),
              }
              manifest["retrievals"].append(ent)
              print(json.dumps(ent,indent=2))
          (OUT/"manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          PY
          sha256sum out/raw/* out/inner/* > out/logs/SHA256SUMS.txt
          cat out/manifest.json
      - name: Upload Table 16B files
        uses: actions/upload-artifact@v4
        with:
          name: cms-table16b-official
          path: out/
          retention-days: 3
