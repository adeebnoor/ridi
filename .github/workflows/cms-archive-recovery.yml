name: CMS archive recovery
on:
  push:
    paths:
      - '.github/workflows/cms-archive-recovery.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact official CMS target snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/raw out/tps out/logs
          python - <<'PY'
          import urllib.request, json, hashlib, zipfile, io, datetime, pathlib, re

          OUT=pathlib.Path("out")
          API="https://data.cms.gov/provider-data/api/1/archive/aggregate/theme/hospitals/relative"
          TARGETS={
              "2024-10-30":15146617,
              "2025-02-19":15297582,
              "2026-02-25":13806586,
          }

          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (RIDI reproducibility audit)"})
              with urllib.request.urlopen(req,timeout=240) as r:
                  return getattr(r,"status",200), r.read(), dict(r.headers)

          def sha256(b):
              return hashlib.sha256(b).hexdigest()

          status,api_bytes,api_headers=get(API)
          if status != 200:
              raise RuntimeError(f"archive API HTTP {status}")
          (OUT/"logs"/"archive_api_response.json").write_bytes(api_bytes)
          api=json.loads(api_bytes)
          rows=api["data"]
          bydate={x["date"]:x for x in rows if x.get("type")=="theme"}

          manifest={
              "source":"Centers for Medicare & Medicaid Services (CMS) Provider Data Catalog",
              "archive_api":API,
              "archive_api_retrieval_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "targets":[]
          }

          for date,expected_size in TARGETS.items():
              if date not in bydate:
                  raise RuntimeError(f"target {date} absent from CMS archive API")
              meta=bydate[date]
              if int(meta["size"]) != expected_size:
                  raise RuntimeError(f"{date} CMS metadata size changed: {meta['size']} != {expected_size}")
              rel=meta["url"]
              url=rel if rel.startswith("http") else "https://data.cms.gov"+rel
              retrieved=datetime.datetime.now(datetime.timezone.utc).isoformat()
              http,data,headers=get(url)
              raw=OUT/"raw"/f"hospitals_{date}.zip"
              # Save raw bytes before inspecting archive contents.
              raw.write_bytes(data)
              raw_size=raw.stat().st_size
              raw_hash=sha256(data)
              if http != 200:
                  raise RuntimeError(f"{date}: HTTP {http}")
              if raw_size != expected_size:
                  raise RuntimeError(f"{date}: downloaded bytes {raw_size} != CMS metadata {expected_size}")

              z=zipfile.ZipFile(raw,"r")
              listing=[i.filename for i in z.infolist()]
              (OUT/"logs"/f"zip_listing_{date}.txt").write_text("\n".join(listing),encoding="utf-8")

              candidates=[]
              for info in z.infolist():
                  if info.is_dir() or not info.filename.lower().endswith(".csv"):
                      continue
                  # Read enough to identify schema after raw archive has been preserved and hashed.
                  with z.open(info) as fh:
                      head=fh.read(200000)
                  txt=head.decode("utf-8-sig","replace").lower()
                  if "total performance score" in txt and ("facility id" in txt or "provider id" in txt):
                      candidates.append(info.filename)

              exact=[n for n in candidates if pathlib.PurePosixPath(n).name.lower()=="hvbp_tps.csv"]
              if len(exact)==1:
                  member=exact[0]
              elif len(candidates)==1:
                  member=candidates[0]
              else:
                  raise RuntimeError(f"{date}: expected one TPS CSV; exact={exact}, candidates={candidates}")

              tps=z.read(member)
              tps_path=OUT/"tps"/f"{date}_hvbp_tps.csv"
              tps_path.write_bytes(tps)
              entry={
                  "date":date,
                  "cms_archive_id":meta.get("id"),
                  "cms_name":meta.get("name"),
                  "official_url":url,
                  "cms_reported_bytes":expected_size,
                  "retrieval_utc":retrieved,
                  "http_status":http,
                  "raw_zip_bytes":raw_size,
                  "raw_zip_sha256":raw_hash,
                  "tps_archive_member":member,
                  "tps_bytes":len(tps),
                  "tps_sha256":sha256(tps),
                  "zip_member_count":len(listing),
              }
              manifest["targets"].append(entry)
              print(json.dumps(entry,indent=2))

          (OUT/"manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          PY
          sha256sum out/raw/*.zip out/tps/*.csv > out/logs/SHA256SUMS.txt
          echo '=== manifest ==='
          cat out/manifest.json
      - name: Upload exact snapshots and provenance
        uses: actions/upload-artifact@v4
        with:
          name: cms-target-hospital-snapshots
          path: out/
          retention-days: 3
