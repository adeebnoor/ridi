name: CMS archive recovery
on:
  push:
    paths:
      - '.github/workflows/cms-archive-recovery.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Query CMS archive aggregate API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for base in             'https://data.cms.gov/provider-data/api/1'             'https://data.cms.gov/provider-data/api'             'https://data.cms.gov/api/1'
          do
            u="$base/archive/aggregate/theme/hospitals/relative"
            echo "=== $u"
            code=$(curl -L -A 'Mozilla/5.0' -sS -o out/resp.json -w '%{http_code}' "$u" || true)
            echo "HTTP=$code bytes=$(wc -c < out/resp.json)"
            head -c 6000 out/resp.json || true
            echo
            if [ "$code" = "200" ]; then
              cp out/resp.json out/archive_hospitals.json
              break
            fi
          done
      - name: Upload API response
        uses: actions/upload-artifact@v4
        with:
          name: cms-archive-api-response
          path: out/
          retention-days: 3
