name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke-test CLI
        run: |
          python examples/identity_paradox.py
          ridi-audit compare --r0 examples/r0.csv --r1 examples/r1.csv --k 3 5 --out /tmp/audit.json
          ridi-audit control --r0 examples/r0.csv --r1 examples/r1.csv --k 5 --eta 0.001 --out /tmp/control.json
