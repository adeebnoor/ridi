name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke-test Python API
        run: |
          python - <<'PY'
          import pandas as pd
          from ridi_audit import audit, compare_allocations

          direct = compare_allocations(
              ['doc-1', 'doc-2', 'doc-3'],
              ['doc-1', 'doc-2', 'doc-4'],
          )
          assert direct.changed_slots == 1
          assert abs(direct.ridi - 0.5) < 1e-12

          before = pd.read_csv('examples/r0.csv')
          after = pd.read_csv('examples/r1.csv')
          report = audit(before, after, k=[3, 5])
          assert report.n_candidates == 10
          assert len(report.cutoffs) == 2
          controlled = report.control(k=5, eta=0.001)
          assert len(controlled['selected_ids']) == 5
          print(direct)
          print(report)
          PY
      - name: Smoke-test CLI
        run: |
          python examples/identity_paradox.py
          ridi-audit --version
          ridi-audit demo
          printf 'doc-1\ndoc-2\ndoc-3\n' > /tmp/before_ids.txt
          printf 'doc-1\ndoc-2\ndoc-4\n' > /tmp/after_ids.txt
          ridi-audit allocation --before /tmp/before_ids.txt --after /tmp/after_ids.txt --out /tmp/allocation.json --report /tmp/allocation.md
          python - <<'PY'
          import json
          result = json.load(open('/tmp/allocation.json'))
          assert result['changed_slots'] == 1
          assert abs(result['ridi'] - 0.5) < 1e-12
          PY
          ridi-audit compare --r0 examples/r0.csv --r1 examples/r1.csv --k 3 5 --out /tmp/audit.json
          ridi-audit control --r0 examples/r0.csv --r1 examples/r1.csv --k 5 --eta 0.001 --out /tmp/control.json
      - name: Build wheel and source distribution
        run: python -m build
