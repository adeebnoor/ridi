name: Frontier downstream RAG preparation

on:
  push:
    branches: [main]
    paths:
      - "experiments/frontier_downstream_rag/RUN_TRIGGER"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  retrieve:
    name: retrieve-${{ matrix.dataset }}-${{ matrix.retriever }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        dataset: [nq, hotpotqa, fever, scifact]
        retriever: [bm25, splade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked preparation stack
        run: python -m pip install -U pip && pip install -r experiments/frontier_downstream_rag/requirements-frontier.txt
      - name: Retrieve top-1000 with local frozen topics
        run: >-
          python experiments/frontier_downstream_rag/retrieve_frontier_inputs.py
          --dataset ${{ matrix.dataset }}
          --retriever ${{ matrix.retriever }}
          --root .prep/${{ matrix.dataset }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-run-${{ matrix.dataset }}-${{ matrix.retriever }}
          path: |
            .prep/${{ matrix.dataset }}/runs
            .prep/${{ matrix.dataset }}/sources
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: assemble-${{ matrix.dataset }}
    needs: [retrieve]
    if: ${{ needs.retrieve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        dataset: [nq, hotpotqa, fever, scifact]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked preparation stack
        run: python -m pip install -U pip && pip install -r experiments/frontier_downstream_rag/requirements-frontier.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: frontier-run-${{ matrix.dataset }}-*
          path: .prep/${{ matrix.dataset }}
          merge-multiple: true
      - name: Freeze outcome-blind 100-query sample
        run: >-
          python experiments/frontier_downstream_rag/assemble_frontier_sample.py
          --dataset ${{ matrix.dataset }}
          --root .prep/${{ matrix.dataset }}
          --repo-root .
      - name: Record environment
        run: python -m pip freeze > .prep/${{ matrix.dataset }}/frozen/${{ matrix.dataset }}_pip_freeze.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-prepared-${{ matrix.dataset }}
          path: .prep/${{ matrix.dataset }}/frozen
          if-no-files-found: error
          retention-days: 30
