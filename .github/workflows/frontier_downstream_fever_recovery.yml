name: Frontier downstream FEVER assembly recovery

on:
  push:
    branches: [main]
    paths:
      - "experiments/frontier_downstream_rag/FEVER_TRIGGER"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"
  SOURCE_RETRIEVAL_RUN: "35350211540"

jobs:
  assemble-fever:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked preparation stack
        run: python -m pip install -U pip && pip install -r experiments/frontier_downstream_rag/requirements-frontier.txt
      - name: Download frozen FEVER retrieval artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: frontier-run-fever-*
          path: .prep/fever
          merge-multiple: true
          repository: adeebnoor/ridi
          run-id: ${{ env.SOURCE_RETRIEVAL_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Freeze FEVER amended sample
        run: >-
          python experiments/frontier_downstream_rag/assemble_frontier_sample.py
          --dataset fever --root .prep/fever --repo-root .
      - name: Record environment
        run: python -m pip freeze > .prep/fever/frozen/fever_pip_freeze.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-prepared-fever
          path: .prep/fever/frozen
          if-no-files-found: error
          retention-days: 30
