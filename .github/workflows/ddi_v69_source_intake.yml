name: DDI v69 public-source intake
on:
  push:
    branches: ['research/ddi-v69-source-audit-20260914']
    paths: ['.github/workflows/ddi_v69_source_intake.yml']
permissions:
  contents: read
jobs:
  public-source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve official public-use sources without publishing patient derivatives
        shell: bash
        run: |
          mkdir -p intake
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request, hashlib, json, datetime, time
          root=Path('intake')
          files={
          'RXQ_RX_I.xpt':'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2015/DataFiles/RXQ_RX_I.xpt',
          'RXQ_RX_J.xpt':'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2017/DataFiles/RXQ_RX_J.xpt',
          'DEMO_I.xpt':'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2015/DataFiles/DEMO_I.xpt',
          'DEMO_J.xpt':'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2017/DataFiles/DEMO_J.xpt',
          'mimic_demo_prescriptions.csv.gz':'https://physionet.org/files/mimic-iv-demo/2.2/hosp/prescriptions.csv.gz'}
          records=[]
          for name,url in files.items():
              row={'file':name,'url':url,'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'RIDI-public-data-reproducibility/1.0'})
                  with urllib.request.urlopen(req,timeout=40) as r: data=r.read()
                  if name.endswith('.xpt') and not data.startswith(b'HEADER RECORD'): raise ValueError('Not an XPORT data file; refusing HTML/error fallback')
                  if name.endswith('.gz') and not data.startswith(b'\x1f\x8b'): raise ValueError('Not gzip')
                  (root/name).write_bytes(data)
                  row.update(status='downloaded',bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              except Exception as e: row.update(status='failed',error=str(e))
              records.append(row)
              print(json.dumps(row))
              time.sleep(1)
          (root/'source_manifest.json').write_text(json.dumps(records,indent=2))
          (root/'NOTICE.md').write_text('Temporary author-side research intake of officially public-use original sources only. NHANES: CDC/NCHS 2015-2018 prescription and demographic public-use files; follow NCHS data-use and citation requirements; no reidentification. MIMIC-IV Clinical Database Demo v2.2: PhysioNet, DOI 10.13026/dp1f-ex47, Open Data Commons Open Database License 1.0. No patient-level derivatives are created here. Do not include these original data in the final public research package; retain source manifests and retrieval code instead. No credentials or restricted patient data are used. Artifact retention is one day.\n')
          PY
      - name: Return temporary intake to the author
        uses: actions/upload-artifact@v4
        with:
          name: ddi-v69-official-public-source-intake
          path: intake/
          retention-days: 1
          if-no-files-found: error
