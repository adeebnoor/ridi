[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ridi-audit"
version = "1.0.0"
description = "Measure, certify and control decision-identity turnover under representation interventions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Adeeb Noor"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10"
]
keywords = [
  "reproducibility",
  "decision identity",
  "representation intervention",
  "ranking stability",
  "audit",
  "top-k selection"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
ridi-audit = "ridi_audit.cli:main"

[project.urls]
Homepage = "https://github.com/adeebnoor/ridi"
Source = "https://github.com/adeebnoor/ridi"
Issues = "https://github.com/adeebnoor/ridi/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

