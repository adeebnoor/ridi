[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ridi-audit"
version = "1.1.0"
description = "Audit and control allocation identity in capacity-limited AI systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Adeeb Noor"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10"
]
keywords = [
  "allocation identity",
  "AI evaluation",
  "RAG evaluation",
  "information retrieval",
  "reproducibility",
  "decision identity",
  "ranking stability",
  "algorithmic auditing",
  "top-k selection",
  "capacity-limited AI"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "build>=1.2"]

[project.scripts]
ridi-audit = "ridi_audit.cli:main"

[project.urls]
Homepage = "https://github.com/adeebnoor/ridi"
Documentation = "https://github.com/adeebnoor/ridi/tree/main/docs"
Quickstart = "https://github.com/adeebnoor/ridi/blob/main/docs/QUICKSTART.md"
Colab = "https://colab.research.google.com/github/adeebnoor/ridi/blob/main/notebooks/RIDI_60_Second_Experiment.ipynb"
Reporting = "https://github.com/adeebnoor/ridi/blob/main/docs/REPORTING_CHECKLIST.md"
Evidence = "https://github.com/adeebnoor/ridi/blob/main/paper/README.md"
Demo = "https://ridi-research-lab.onrender.com/demo/"
Source = "https://github.com/adeebnoor/ridi"
Issues = "https://github.com/adeebnoor/ridi/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
